<template data-composition-id="01-intro">
  <style>
    #root {
      width: 100%; height: 100%;
      background: var(--brand-navy, #27963C);
      color: white;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      container-type: inline-size;
      position: relative;
      overflow: hidden;
    }
    .f1-bg-elements { position: absolute; inset: 0; z-index: 0; opacity: 0.1; }
    .f1-circle { position: absolute; border-radius: 50%; background: white; }
    .f1-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
    .f1-logo-img { width: 30cqw; margin-bottom: 2cqw; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3)); border-radius: 20px;}
    .f1-title { font-size: 6cqw; font-family: var(--font-display); font-weight: 900; letter-spacing: -1px; text-align: center; }
    .f1-sub { font-size: 3.5cqw; color: var(--brand-accent, #D4AF37); margin-top: 1cqw; font-weight: bold; text-align: center;}
  </style>
  <div id="root" data-composition-id="01-intro" data-width="1920" data-height="1080" class="clip" data-duration="30">
    <div class="f1-bg-elements">
      <div class="f1-circle" style="width: 800px; height: 800px; top: -200px; left: -200px;"></div>
      <div class="f1-circle" style="width: 1200px; height: 1200px; bottom: -400px; right: -400px;"></div>
    </div>
    <div class="f1-content">
      <img class="f1-logo-img" src="https://logo.clearbit.com/fondation-ove.fr" alt="Fondation OVE"  />
      <div class="f1-title">PRÉVENTION & DÉTECTION</div>
      <div class="f1-sub">DES ATTEINTES À LA PROBITÉ</div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl_01intro = window.gsap ? gsap.timeline({ paused: true }) : { fromTo: ()=>{}, to: ()=>{} };
    const root_01intro = document.getElementById("root") || document.body;
    
    // BG animation
    tl_01intro.fromTo(root_01intro.querySelectorAll('.f1-circle'), 
      { scale: 0, opacity: 0 }, 
      { scale: 1.5, opacity: 0.1, duration: 4, ease: "power2.out", stagger: 0.5 }, 0);
      
    // Logo entrance (Dynamic 3D pop)
    tl_01intro.fromTo(root_01intro.querySelector('.f1-logo-img'), 
      { scale: 0.2, y: 100, rotationX: 45, opacity: 0 }, 
      { scale: 1, y: 0, rotationX: 0, opacity: 1, duration: 1.5, ease: "elastic.out(1, 0.5)" }, 0.5);
      
    // Continuous subtle float on logo
    tl_01intro.to(root_01intro.querySelector('.f1-logo-img'), 
      { y: -15, duration: 2, repeat: 10, yoyo: true, ease: "sine.inOut" }, 2);

    // Title entrance
    tl_01intro.fromTo(root_01intro.querySelector('.f1-title'), 
      { opacity: 0, x: -50, filter: "blur(10px)" }, 
      { opacity: 1, x: 0, filter: "blur(0px)", duration: 1, ease: "power3.out" }, 1.2);
      
    // Subtitle entrance
    tl_01intro.fromTo(root_01intro.querySelector('.f1-sub'), 
      { opacity: 0, x: 50, filter: "blur(10px)" }, 
      { opacity: 1, x: 0, filter: "blur(0px)", duration: 1, ease: "power3.out" }, 1.4);

    window.__timelines["01-intro"] = tl_01intro;
  </script>
</template>
