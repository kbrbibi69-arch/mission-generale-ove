<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mission Generale OVE</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    .composition { width: 1920px; height: 1080px; position: relative; }
    .track { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <div class="clip composition" id="root" data-composition-id="index" data-width="1920" data-height="1080" data-duration="300">
    <div class="track" id="video-track">
      <div id="scene-01" class="clip" data-composition-id="01-intro" data-start="0" data-duration="30" data-composition-src="compositions/frames/01-intro.html"></div>
      <div id="scene-02" class="clip" data-composition-id="02-ecosystem" data-start="30" data-duration="45" data-composition-src="compositions/frames/02-ecosystem.html"></div>
      <div id="scene-03" class="clip" data-composition-id="03-message" data-start="75" data-duration="40" data-composition-src="compositions/frames/03-message.html"></div>
      <div id="scene-04" class="clip" data-composition-id="04-risks" data-start="115" data-duration="50" data-composition-src="compositions/frames/04-risks.html"></div>
      <div id="scene-05" class="clip" data-composition-id="05-dispositif" data-start="165" data-duration="50" data-composition-src="compositions/frames/05-dispositif.html"></div>
      <div id="scene-06" class="clip" data-composition-id="06-methode" data-start="215" data-duration="45" data-composition-src="compositions/frames/06-methode.html"></div>
      <div id="scene-07" class="clip" data-composition-id="07-conclusion" data-start="260" data-duration="40" data-composition-src="compositions/frames/07-conclusion.html"></div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["index"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
