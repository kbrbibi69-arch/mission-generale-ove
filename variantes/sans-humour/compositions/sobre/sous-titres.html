<div id="root" data-composition-id="sous-titres-sobre" data-width="1920" data-height="1080" data-duration="307.03">
  <div class="cap" id="cap-sobre-0"><span>Prévenir les atteintes à la probité.</span></div>
  <div class="cap" id="cap-sobre-1"><span>Pour la Fondation OVE, c’est d’abord une question de confiance.</span></div>
  <div class="cap" id="cap-sobre-2"><span>Cette présentation de la Direction juridique explique pourquoi une démarche</span></div>
  <div class="cap" id="cap-sobre-3"><span>structurée, inspirée de la loi Sapin 2, présente un intérêt stratégique.</span></div>
  <div class="cap" id="cap-sobre-4"><span>La Fondation OVE est une fondation reconnue d’utilité publique.</span></div>
  <div class="cap" id="cap-sobre-5"><span>Elle mobilise un budget d’environ 180 millions d’euros et près de 2 500 salariés.</span></div>
  <div class="cap" id="cap-sobre-6"><span>Elle accompagne chaque année plus de 15 000 personnes, sur l’ensemble du territoire.</span></div>
  <div class="cap" id="cap-sobre-7"><span>Sa gouvernance repose sur un conseil d’administration de 15 membres, un Bureau</span></div>
  <div class="cap" id="cap-sobre-8"><span>et une direction générale.</span></div>
  <div class="cap" id="cap-sobre-9"><span>Autour d’elle s’est constitué un écosystème structuré :</span></div>
  <div class="cap" id="cap-sobre-10"><span>le fonds de dotation IMOVE, véhicule immobilier et financier, et plus de 35</span></div>
  <div class="cap" id="cap-sobre-11"><span>sociétés civiles immobilières, qui portent le patrimoine.</span></div>
  <div class="cap" id="cap-sobre-12"><span>S’y ajoutent quatre associations partenaires :</span></div>
  <div class="cap" id="cap-sobre-13"><span>AMICIAL, gouvernée avec la Croix-Rouge française ;</span></div>
  <div class="cap" id="cap-sobre-14"><span>OVE Plenior, qui mutualise ses fonctions support avec la Fondation ;</span></div>
  <div class="cap" id="cap-sobre-15"><span>OVE Caraïbes, en outre-mer ; et Ressourcial, pour des prestations au sein du réseau.</span></div>
  <div class="cap" id="cap-sobre-16"><span>Cette organisation répond à des objectifs légitimes :</span></div>
  <div class="cap" id="cap-sobre-17"><span>coopérer, mutualiser, se spécialiser, distinguer le médico-social du</span></div>
  <div class="cap" id="cap-sobre-18"><span>patrimoine immobilier.</span></div>
  <div class="cap" id="cap-sobre-19"><span>Elle multiplie aussi les conventions, les flux et les mandats croisés, exercés</span></div>
  <div class="cap" id="cap-sobre-20"><span>par un nombre limité de décideurs.</span></div>
  <div class="cap" id="cap-sobre-21"><span>Cette configuration ne révèle en elle-même aucune irrégularité.</span></div>
  <div class="cap" id="cap-sobre-22"><span>Elle appelle simplement un cadre commun.</span></div>
  <div class="cap" id="cap-sobre-23"><span>Sur le plan juridique, l’article 17 de la loi Sapin 2 impose un programme</span></div>
  <div class="cap" id="cap-sobre-24"><span>anticorruption à certaines entreprises dépassant des seuils précis.</span></div>
  <div class="cap" id="cap-sobre-25"><span>Sans analyse complémentaire, on ne peut affirmer que la Fondation y est</span></div>
  <div class="cap" id="cap-sobre-26"><span>assujettie comme une société commerciale.</span></div>
  <div class="cap" id="cap-sobre-27"><span>En revanche, l’article 3 habilite l’Agence française anticorruption, l’AFA, à</span></div>
  <div class="cap" id="cap-sobre-28"><span>contrôler de sa propre initiative les fondations reconnues d’utilité publique.</span></div>
  <div class="cap" id="cap-sobre-29"><span>Elle examine leurs procédures contre la corruption, le trafic d’influence, la</span></div>
  <div class="cap" id="cap-sobre-30"><span>prise illégale d’intérêts, le détournement de fonds publics ou le favoritisme.</span></div>
  <div class="cap" id="cap-sobre-31"><span>Pourquoi agir maintenant ? Parce que l’environnement devient plus exigeant.</span></div>
  <div class="cap" id="cap-sobre-32"><span>Les financeurs publics attendent des garanties de bonne gouvernance, et les</span></div>
  <div class="cap" id="cap-sobre-33"><span>affaires récentes du secteur ont accru la vigilance.</span></div>
  <div class="cap" id="cap-sobre-34"><span>S’en tenir à des dispositifs dispersés exposerait peu à peu la mission, les</span></div>
  <div class="cap" id="cap-sobre-35"><span>décideurs, les financements et la réputation de la Fondation.</span></div>
  <div class="cap" id="cap-sobre-36"><span>Pour la Fondation OVE, appliquer les principes de la loi Sapin 2 ne consiste</span></div>
  <div class="cap" id="cap-sobre-37"><span>pas seulement à répondre à un environnement juridique.</span></div>
  <div class="cap" id="cap-sobre-38"><span>Il s’agit de protéger sa mission d’intérêt général, les personnes</span></div>
  <div class="cap" id="cap-sobre-39"><span>accompagnées, ses décideurs, ses collaborateurs, ses ressources et la</span></div>
  <div class="cap" id="cap-sobre-40"><span>confiance de ses partenaires.</span></div>
  <div class="cap" id="cap-sobre-41"><span>Ce cadre protège aussi celles et ceux qui décident.</span></div>
  <div class="cap" id="cap-sobre-42"><span>Lorsqu’une même personne siège dans plusieurs instances, selon une logique de</span></div>
  <div class="cap" id="cap-sobre-43"><span>réseau, quatre questions deviennent essentielles.</span></div>
  <div class="cap" id="cap-sobre-44"><span>Pour le compte de quelle personne morale la décision est-elle prise ?</span></div>
  <div class="cap" id="cap-sobre-45"><span>Quelle instance doit l’autoriser ?</span></div>
  <div class="cap" id="cap-sobre-46"><span>Quelle délégation permet de signer ?</span></div>
  <div class="cap" id="cap-sobre-47"><span>Quelles informations remonter à chaque gouvernance ?</span></div>
  <div class="cap" id="cap-sobre-48"><span>Des réponses écrites et partagées valent mieux que des usages implicites.</span></div>
  <div class="cap" id="cap-sobre-49"><span>En cas de contrôle, pouvoir le démontrer est une protection.</span></div>
  <div class="cap" id="cap-sobre-50"><span>Le dispositif proposé repose sur les trois piliers recommandés par l’AFA :</span></div>
  <div class="cap" id="cap-sobre-51"><span>l’engagement de la gouvernance, la cartographie des risques, et des mesures adaptées.</span></div>
  <div class="cap" id="cap-sobre-52"><span>Concrètement : un code de conduite, une politique de gestion des conflits</span></div>
  <div class="cap" id="cap-sobre-53"><span>d’intérêts et des mandats croisés, un dispositif d’alerte interne sécurisé,</span></div>
  <div class="cap" id="cap-sobre-54"><span>une évaluation proportionnée des tiers, des contrôles comptables ciblés, et un</span></div>
  <div class="cap" id="cap-sobre-55"><span>plan de formation.</span></div>
  <div class="cap" id="cap-sobre-56"><span>Proportionné signifie graduer les exigences selon les montants, l’urgence et les risques.</span></div>
  <div class="cap" id="cap-sobre-57"><span>L’objectif est de sécuriser, sans alourdir.</span></div>
  <div class="cap" id="cap-sobre-58"><span>La démarche se déploierait progressivement, sur deux ans.</span></div>
  <div class="cap" id="cap-sobre-59"><span>Année 1 : comprendre, cartographier, concevoir.</span></div>
  <div class="cap" id="cap-sobre-60"><span>Cadrage, diagnostic, cartographie des risques, dispositif cible.</span></div>
  <div class="cap" id="cap-sobre-61"><span>Année 2 : valider, déployer, ajuster.</span></div>
  <div class="cap" id="cap-sobre-62"><span>Validation, formations, pilote, généralisation, bilan.</span></div>
  <div class="cap" id="cap-sobre-63"><span>Des indicateurs en mesureront l’effectivité.</span></div>
  <div class="cap" id="cap-sobre-64"><span>Soyons lucides : aucun dispositif ne supprime totalement le risque.</span></div>
  <div class="cap" id="cap-sobre-65"><span>Il permet de le réduire, de le maîtriser, et de démontrer la diligence de la Fondation.</span></div>
  <div class="cap" id="cap-sobre-66"><span>Il est donc proposé au Bureau de reconnaître l’intérêt stratégique de la démarche,</span></div>
  <div class="cap" id="cap-sobre-67"><span>d’autoriser le diagnostic et la cartographie des risques, de désigner la</span></div>
  <div class="cap" id="cap-sobre-68"><span>Direction générale comme sponsor, et de confier le pilotage à la Direction juridique,</span></div>
  <div class="cap" id="cap-sobre-69"><span>avec un comité de pilotage transversal et un reporting régulier au Bureau.</span></div>
  <div class="cap" id="cap-sobre-70"><span>Le dispositif définitif restera soumis aux instances compétentes.</span></div>
  <div class="cap" id="cap-sobre-71"><span>Protéger la mission, les personnes, les décideurs et la confiance :</span></div>
  <div class="cap" id="cap-sobre-72"><span>c’est la trajectoire, prudente mais résolue, que nous vous proposons de valider.</span></div>
</div>
